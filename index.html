<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="theme-color" content="#0a4a94"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>الرعاية الطبية المنزلية</title>
<style>
:root{--bg:#e8f2fb;--c:#fff;--tx:#0b2240;--mu:#3b5577;--pr:#0a4a94;--pt:#fff;--ac:#2bbfcb;--bd:#86a9cc;--wr:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#06172e;--c:#0d2a4f;--tx:#eaf3fb;--mu:#a9c3de;--pr:#5aa9f2;--pt:#04162b;--ac:#35d0dc;--bd:#3d6694;--wr:#ff8a80}}
:root[data-theme=dark]{--bg:#06172e;--c:#0d2a4f;--tx:#eaf3fb;--mu:#a9c3de;--pr:#5aa9f2;--pt:#04162b;--ac:#35d0dc;--bd:#3d6694;--wr:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:20px/1.6 system-ui,"Segoe UI",Tahoma,Arial,sans-serif}
nav{position:fixed;top:0;bottom:0;inset-inline-start:0;width:260px;background:var(--c);border-inline-end:3px solid var(--bd);padding:calc(10px + env(safe-area-inset-top,0px)) 10px 10px;overflow-y:auto;z-index:5;transition:transform .2s}
nav button{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;margin:6px 0;padding:8px 14px;font-size:21px;text-align:start}
nav button span{font-size:34px}
main{margin-inline-start:260px;padding:20px;max-width:1100px}
#mb{display:none;position:fixed;top:calc(8px + env(safe-area-inset-top,0px));inset-inline-start:8px;z-index:6;min-height:56px;font-size:28px}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--c);border:3px solid var(--bd);border-radius:14px;padding:12px 20px;min-height:56px;cursor:pointer}
button.p{background:var(--pr);color:var(--pt);border-color:var(--pr);font-weight:700}button.w{border-color:var(--wr);color:var(--wr)}
nav button.on{background:var(--pr);color:var(--pt);border-color:var(--pr)}
input,select,textarea{width:100%;padding:12px;min-height:56px;background:var(--c);border:3px solid var(--bd);border-radius:12px}
label{display:block;margin:12px 0;font-weight:700}
h1{font-size:32px;margin:0 0 16px}h2{font-size:25px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.f{display:grid;gap:0 18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.k,.card{background:var(--c);border:3px solid var(--bd);border-radius:16px;padding:16px;margin:10px 0}
.k{text-align:center;margin:0}.k b{display:block;font-size:46px;color:var(--pr)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>.grow{flex:1;min-width:200px}
.tag{display:inline-block;padding:2px 12px;border-radius:99px;border:2px solid var(--pr);font-weight:700}
.mu{color:var(--mu)}table{width:100%;border-collapse:collapse}th,td{padding:10px;border:2px solid var(--bd);text-align:start}
.wrap{overflow-x:auto}
h1{border-bottom:4px solid var(--ac);padding-bottom:8px}.k{border-top:6px solid var(--ac)}.tag{border-color:var(--ac)}nav{border-inline-end:4px solid var(--ac)}.brand{background:var(--pr);color:var(--pt);border-radius:14px;padding:14px;margin-bottom:8px;font-weight:800;font-size:22px;text-align:center;border-bottom:5px solid var(--ac)}
@media(max-width:820px){nav{transform:translateX(-110%)}[dir=rtl] nav{transform:translateX(110%)}nav.o{transform:none!important}main{margin-inline-start:0;padding-top:80px}#mb{display:block}}
@media print{nav,#mb,.np{display:none!important}main{margin:0;padding:0}body{background:#fff;color:#000}}
</style></head><body>
<button id="mb" onclick="document.querySelector('nav').classList.toggle('o')" aria-label="menu">☰</button><nav id="nv"></nav><main id="m"></main>
<script>
const $=id=>document.getElementById(id),g=id=>$(id).value;
const h=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'),fm=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
const mk=(y,m,d)=>{const x=new Date(y,m,1);y=x.getFullYear();m=x.getMonth();return fm(y,m,Math.min(d,new Date(y,m+1,0).getDate()))};
const today=()=>{const n=new Date();return fm(n.getFullYear(),n.getMonth(),n.getDate())};
const add=(s,n)=>{const[a,b,c]=s.split('-').map(Number);const x=new Date(a,b-1,c+n);return fm(x.getFullYear(),x.getMonth(),x.getDate())};
const first=d=>{const n=new Date(),c=mk(n.getFullYear(),n.getMonth(),d);return c>=today()?c:mk(n.getFullYear(),n.getMonth()+1,d)};
let D=(()=>{try{const s=localStorage.getItem('hc');if(s)return JSON.parse(s)}catch(e){}return{p:[],v:[],s:{doc:'',nur:'',tpl:'تذكير: لديكم زيارة طبية منزلية يوم {date} الساعة {time}.',days:1,email:'',lang:'ar'}}})();
const save=()=>{try{localStorage.setItem('hc',JSON.stringify(D))}catch(e){alert(t('تعذر الحفظ (المساحة ممتلئة)','Save failed (storage full)'))}};
let L=D.s.lang||'ar',V='home',PID=null,VID=null,Q='',R='d',AUD='';
const t=(a,e)=>L=='ar'?a:e,uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const pn=id=>(D.p.find(p=>p.id==id)||{}).name||'—';
const ST={s:['مجدولة','Scheduled'],d:['تمت الزيارة','Done'],p:['تأجلت','Postponed'],n:['لم يتمكن الفريق من الزيارة','Team could not visit'],c:['ألغيت','Cancelled']};
const st=k=>ST[k][L=='ar'?0:1];
const NAV=[['home','🏠','الرئيسية','Home'],['patients','👨‍⚕️','المرضى','Patients'],['appts','📅','المواعيد','Appointments'],['visits','🩺','الزيارات','Visits'],['readings','📊','متابعة القراءات','Readings'],['notes','📝','الملاحظات والمشاكل','Notes & problems'],['files','📎','المرفقات','Attachments'],['reports','📋','التقارير','Reports'],['backup','💾','النسخ الاحتياطي','Backup'],['settings','⚙️','الإعدادات','Settings']];
const go=(v,p,x)=>{V=v;if(p!==undefined)PID=p;if(x!==undefined)VID=x;document.querySelector('nav').classList.remove('o');draw();scrollTo(0,0)};
function draw(){document.documentElement.lang=L;document.documentElement.dir=L=='ar'?'rtl':'ltr';
$('nv').innerHTML='<div class="brand">🩺 '+t('الرعاية الصحية المنزلية','Home Healthcare')+'</div>'+NAV.filter(n=>R=='d'||!['backup','settings'].includes(n[0])).map(n=>`<button class="${V==n[0]||(V=='pf'&&n[0]=='patients')||(V=='vf'&&n[0]=='visits')?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[L=='ar'?2:3]}</button>`).join('')+`<label>${t('الدور','Role')}<select onchange="R=this.value;if(R=='n'&&['backup','settings'].includes(V))V='home';draw()"><option value="d" ${R=='d'?'selected':''}>${t('طبيب','Doctor')}</option><option value="n" ${R=='n'?'selected':''}>${t('ممرض','Nurse')}</option></select></label>`;
$('m').innerHTML=VW[V]()}
const pill=v=>`<span class="tag">${st(v.status)}</span>`;
function vc(v){const w=D.s.tpl.replace('{date}',v.date).replace('{time}',v.time||'').replace('{name}',pn(v.pid));let ph=((D.p.find(p=>p.id==v.pid)||{}).phone||'').replace(/\D/g,'');if(ph[0]=='0')ph='966'+ph.slice(1);
return`<div class="card row"><div class="grow"><b>${h(pn(v.pid))}</b><br>${v.date} ${h(v.time||'')} ${pill(v)}</div><button class="p" onclick="go('vf',null,'${v.id}')">✏️ ${t('فتح / تعديل','Open / Edit')}</button><button class="w" onclick="delV('${v.id}')" aria-label="delete">🗑️</button>${v.status=='s'&&ph?`<a href="https://api.whatsapp.com/send?phone=${ph}&text=${encodeURIComponent(w)}" target="_blank" rel="noopener"><button>💬 ${t('تذكير واتساب','WhatsApp')}</button></a><button onclick="cpM('${v.id}')">📋 ${t('نسخ الرسالة','Copy')}</button>`:''}</div>`}
const sched=()=>D.v.filter(v=>v.status=='s').sort((a,b)=>a.date.localeCompare(b.date));
const VW={
home(){const T=today(),tm=add(T,1),S=sched();return`<h1>🏠 ${t('الرئيسية','Home')}</h1><div class="g"><div class="k">${t('زيارات اليوم','Today')}<b>${S.filter(v=>v.date==T).length}</b></div><div class="k">${t('زيارات الغد','Tomorrow')}<b>${S.filter(v=>v.date==tm).length}</b></div><div class="k">${t('الزيارات القادمة','Upcoming')}<b>${S.filter(v=>v.date>tm).length}</b></div><div class="k">${t('عدد المرضى','Patients')}<b>${D.p.length}</b></div><div class="k">${t('المواعيد المجدولة','Scheduled')}<b>${S.length}</b></div></div><h2>${t('وصول سريع لملف مريض','Quick patient access')}</h2>${srch()}<h2>${t('الزيارات القادمة','Upcoming')}</h2>${S.slice(0,5).map(vc).join('')||`<p class="mu">${t('لا توجد زيارات','No visits')}</p>`}`},
patients(){return`<h1>👨‍⚕️ ${t('المرضى','Patients')}</h1><div class="row np"><div class="grow">${srch()}</div><button class="p" onclick="go('pe',null)">➕ ${t('إضافة مريض','Add patient')}</button></div>`},
pe(){const p=D.p.find(x=>x.id==PID)||{};const f=(i,l,v,ty)=>`<label>${l}<input id="${i}" type="${ty||'text'}" value="${h(v)}"></label>`;
return`<h1>${p.id?t('تعديل مريض','Edit patient'):t('إضافة مريض','Add patient')}</h1><div class="f">${f('a1',t('رقم الملف الطبي','Medical file no.'),p.mrn)}${f('a2',t('رقم بطاقة الأحوال المدنية','Civil ID no.'),p.cid)}${f('a3',t('الاسم','Name'),p.name)}${f('a4',t('العمر','Age'),p.age,'number')}${f('a5',t('رقم الجوال','Mobile'),p.phone,'tel')}${f('a6',t('سبب المرض','Illness reason'),p.reason)}${f('a7',t('يوم الزيارة الشهري (1-31)','Monthly visit day (1-31)'),p.day,'number')}</div><label>${t('مشاكل وملاحظات المريض','Patient problems & notes')}<textarea id="a8">${h(p.complaints)}</textarea></label><label>${t('ملاحظات إضافية','Extra notes')}<textarea id="a9">${h(p.extra)}</textarea></label><div class="row"><button class="p" onclick="saveP()">💾 ${t('حفظ','Save')}</button><button onclick="go('patients')">${t('رجوع','Back')}</button></div>`},
pf(){const p=D.p.find(x=>x.id==PID);if(!p)return'';const vs=D.v.filter(v=>v.pid==p.id).sort((a,b)=>b.date.localeCompare(a.date));
return`<h1>👨‍⚕️ ${h(p.name)}</h1><div class="card">${t('الملف','File')}: <b>${h(p.mrn)}</b> · ${t('الهوية','ID')}: ${h(p.cid)} · ${t('العمر','Age')}: ${h(p.age)} · 📞 ${h(p.phone)}<br>${t('سبب المرض','Reason')}: ${h(p.reason)}<br>${t('يوم الزيارة','Visit day')}: ${h(p.day)}<br>${t('المشاكل','Problems')}: ${h(p.complaints)}<br>${t('ملاحظات','Notes')}: ${h(p.extra)}</div><div class="row np"><button onclick="go('pe',${JSON.stringify(p.id)})">✏️ ${t('تعديل','Edit')}</button><button onclick="go('reports',${JSON.stringify(p.id)})">📋 ${t('تقرير','Report')}</button><button class="w" onclick="delP('${p.id}')">🗑️ ${t('حذف','Delete')}</button><button onclick="go('patients')">${t('رجوع','Back')}</button></div><h2>🩺 ${t('سجل الزيارات','Visit log')}</h2>${vs.map(vc).join('')||'—'}<h2>📝 ${t('الملاحظات','Notes')}</h2>${nl(p)}${nf(p)}<h2>📎 ${t('المرفقات (اختيارية)','Attachments (optional)')}</h2>${al(p)}<div class="row np"><label>📷 ${t('كاميرا','Camera')}<input type="file" accept="image/*" capture="environment" onchange="upl(this)"></label><label>🖼️ ${t('صورة أو ملف','Image or file')}<input type="file" onchange="upl(this)"></label></div>`},
appts(){return`<h1>📅 ${t('المواعيد','Appointments')}</h1>${[[t('زيارة الغد','Tomorrow'),v=>v.date==add(today(),1)],[t('الزيارات القادمة','Upcoming'),v=>v.date>add(today(),1)],[t('اليوم والمتأخرة','Today & overdue'),v=>v.date<=today()]].map(([l,f])=>`<h2>${l}</h2>${sched().filter(f).map(vc).join('')||'—'}`).join('')}<h2>${t('جميع الزيارات المجدولة','All scheduled')}</h2>${sched().map(vc).join('')||'—'}`},
visits(){return`<h1>🩺 ${t('الزيارات','Visits')}</h1>${[...D.v].sort((a,b)=>b.date.localeCompare(a.date)).map(vc).join('')||'—'}`},
vf(){const v=D.v.find(x=>x.id==VID);if(!v)return'';const dis=(r)=>R!=r?'disabled':'';
return`<h1>🩺 ${h(pn(v.pid))}</h1><div class="f"><label>${t('التاريخ','Date')}<input id="b1" type="date" value="${v.date}"></label><label>${t('الوقت','Time')}<input id="b2" type="time" value="${v.time||''}"></label><label>${t('الطبيب','Doctor')}<input id="b3" value="${h(v.doc||D.s.doc)}"></label><label>${t('الممرض','Nurse')}<input id="b4" value="${h(v.nur||D.s.nur)}"></label><label>${t('نتيجة تحليل السكر','Blood sugar')}<input id="b5" value="${h(v.sugar)}"></label><label>${t('ضغط الدم','Blood pressure')}<input id="b6" value="${h(v.bp)}"></label><label>${t('حالة الزيارة','Visit status')}<select id="b7">${Object.keys(ST).map(k=>`<option value="${k}" ${v.status==k?'selected':''}>${st(k)}</option>`).join('')}</select></label><label>${t('حالة المريض','Patient condition')}<input id="b8" value="${h(v.cond)}"></label></div><label>${t('ملاحظات الطبيب','Doctor notes')}<textarea id="c1" ${dis('d')}>${h(v.dn)}</textarea></label><label>${t('ملاحظات الممرض','Nurse notes')}<textarea id="c2" ${dis('n')}>${h(v.nn)}</textarea></label><label>${t('المشاكل أو الشكاوى الجديدة','New problems')}<textarea id="c3">${h(v.newp)}</textarea></label><label>${t('الإجراءات التي تمت','Actions taken')}<textarea id="c4">${h(v.act)}</textarea></label><label>${t('التوصيات','Recommendations')}<textarea id="c5">${h(v.rec)}</textarea></label><div class="row"><button class="p" onclick="saveV(1)">✅ ${t('تمت الزيارة','Visit done')}</button><button onclick="saveV(0)">💾 ${t('حفظ','Save')}</button><button class="w" onclick="delV('${v.id}',1)">🗑️ ${t('حذف','Delete')}</button><button onclick="history.length&&go('visits')">${t('رجوع','Back')}</button></div>`},
readings(){const p=PID;return`<h1>📊 ${t('متابعة القراءات','Readings')}</h1><label>${t('المريض','Patient')}<select onchange="PID=this.value;draw()"><option value="">—</option>${D.p.map(x=>`<option value="${x.id}" ${x.id==p?'selected':''}>${h(x.name)}</option>`).join('')}</select></label>${p?`<div class="wrap"><table><tr><th>${t('تاريخ الزيارة','Visit date')}</th><th>${t('السكر','Sugar')}</th><th>${t('الضغط','BP')}</th><th></th></tr>${D.v.filter(v=>v.pid==p&&(v.sugar||v.bp)).sort((a,b)=>b.date.localeCompare(a.date)).map(v=>`<tr><td>${v.date}</td><td>${h(v.sugar)}</td><td>${h(v.bp)}</td><td><button onclick="go('vf',null,'${v.id}')">✏️</button><button class="w" onclick="clrR('${v.id}')">🗑️</button></td></tr>`).join('')}</table></div>`:''}`},
notes(){const a=D.p.flatMap(p=>(p.notes||[]).map(n=>({...n,p})));a.sort((x,y)=>y.at.localeCompare(x.at));return`<h1>📝 ${t('الملاحظات والمشاكل','Notes & problems')}</h1>${nf(null)}${a.map(n=>`<div class="card"><a href="#" onclick="go('pf','${n.p.id}');return false"><b>${h(n.p.name)}</b></a> · ${n.kind=='p'?'⚠️ ':''}${h(n.by)} · <span class="mu">${new Date(n.at).toLocaleString(L=='ar'?'ar-SA':'en-GB')}</span><br>${h(n.text)}${n.audio?`<br><audio controls src="${n.audio}"></audio>`:''}<div class="row np"><button onclick="editN('${n.p.id}','${n.at}')">✏️</button><button class="w" onclick="delN('${n.p.id}','${n.at}')">🗑️</button></div></div>`).join('')||'—'}`},
files(){const a=D.p.flatMap(p=>(p.files||[]).map((f,i)=>({...f,p,i})));return`<h1>📎 ${t('المرفقات','Attachments')}</h1><div class="card np"><label>${t('المريض','Patient')}<select id="fp"><option value="">—</option>${D.p.map(x=>`<option value="${x.id}" ${x.id==PID?'selected':''}>${h(x.name)}</option>`).join('')}</select></label><div class="row"><label>📷 ${t('كاميرا','Camera')}<input type="file" accept="image/*" capture="environment" onchange="upl(this)"></label><label>🖼️ ${t('صورة أو ملف','Image or file')}<input type="file" onchange="upl(this)"></label></div></div>${a.map(f=>`<div class="card row"><div class="grow"><b>${h(f.p.name)}</b> · ${h(f.name)} · ${f.at.slice(0,10)}</div><button onclick="dlF('${f.p.id}',${f.i})">⬇️</button><button onclick="renF('${f.p.id}',${f.i})">✏️</button><button class="w" onclick="delF('${f.p.id}',${f.i})">🗑️</button></div>`).join('')||'—'}`},
reports(){const p=D.p.find(x=>x.id==PID);return`<h1>📋 ${t('التقارير','Reports')}</h1><div class="np"><div class="f"><label>${t('المريض','Patient')}<select id="r1" onchange="PID=this.value">${D.p.map(x=>`<option value="${x.id}" ${x.id==PID?'selected':''}>${h(x.name)}</option>`).join('')}</select></label><label>${t('من','From')}<input id="r2" type="date"></label><label>${t('إلى','To')}<input id="r3" type="date"></label></div><div class="row"><button class="p" onclick="rep()">${t('عرض التقرير','Show report')}</button><button onclick="try{print()}catch(e){}">🖨️ ${t('طباعة','Print')}</button><button class="p" onclick="dlR()">📄 ${t('تقرير PDF (تنزيل ثم طباعة)','PDF report (download, then print)')}</button></div></div><div id="rp"></div>`},
backup(){return`<h1>💾 ${t('النسخ الاحتياطي','Backup')}</h1><div class="card"><label>${t('بريد Google Drive للنسخ الاحتياطي','Google Drive backup email')}<input id="e1" type="email" value="${h(D.s.email)}" onchange="D.s.email=this.value;save()"></label><div class="row"><button class="p" onclick="bk()">⬇️ ${t('تنزيل نسخة احتياطية','Download backup')}</button><label>⬆️ ${t('استعادة من نسخة','Restore')}<input type="file" accept=".json" onchange="rs(this)"></label></div><label>${t('أو الصق نص النسخة هنا','Or paste backup text here')}<textarea id="pb"></textarea></label><div class="row"><button class="p" onclick="rp2()">⬆️ ${t('استعادة من النص','Restore from text')}</button><button onclick="cpB()">📋 ${t('نسخ نص النسخة الحالية','Copy current backup text')}</button></div><p class="mu">${t('احفظ ملف النسخة في Google Drive الخاص بالبريد أعلاه. الربط التلقائي يحتاج إعداد Google OAuth.','Save the backup file to the Google Drive of the email above. Automatic sync needs Google OAuth setup.')}</p></div>`},
settings(){const s=D.s,f=(k,l,ty)=>`<label>${l}<input type="${ty||'text'}" value="${h(s[k])}" onchange="D.s.${k}=this.value;save()"></label>`;return`<h1>⚙️ ${t('الإعدادات','Settings')}</h1><div class="f">${f('doc',t('بيانات الطبيب (الاسم)','Doctor name'))}${f('nur',t('بيانات الممرض (الاسم)','Nurse name'))}${f('days',t('أيام التذكير قبل الزيارة','Reminder days before visit'),'number')}${f('email',t('بريد النسخ الاحتياطي','Backup email'),'email')}</div><label>${t('رسالة واتساب ({name} {date} {time})','WhatsApp message ({name} {date} {time})')}<textarea onchange="D.s.tpl=this.value;save()">${h(s.tpl)}</textarea></label><label>${t('لغة التطبيق','Language')}<select onchange="D.s.lang=L=this.value;save();draw()"><option value="ar" ${L=='ar'?'selected':''}>العربية</option><option value="en" ${L=='en'?'selected':''}>English</option></select></label><div class="card">${t('ربط WhatsApp Business API: مهيأ لاحقًا عبر خادم؛ حاليًا يفتح زر التذكير رسالة جاهزة في واتساب.','WhatsApp Business API: to be connected via a server; for now the reminder button opens a ready message in WhatsApp.')}</div>`}};
function srch(){const q=Q.trim().toLowerCase();const r=q?D.p.filter(p=>[p.mrn,p.cid,p.name,p.phone].some(x=>String(x||'').toLowerCase().includes(q))):D.p;
return`<input placeholder="🔍 ${t('رقم الملف، الهوية، الاسم، الجوال','File no., ID, name, mobile')}" value="${h(Q)}" oninput="Q=this.value;const i=this.selectionStart;draw();const e=document.querySelector('main input');e.focus();e.setSelectionRange(i,i)">${r.map(p=>`<div class="card row" onclick="go('pf','${p.id}')" style="cursor:pointer"><div class="grow"><b>${h(p.name)}</b><br><span class="mu">${h(p.mrn)} · ${h(p.phone)}</span></div><button class="p">${t('فتح الملف','Open')}</button><button onclick="event.stopPropagation();go('pe','${p.id}')">✏️</button><button class="w" onclick="event.stopPropagation();delP('${p.id}')">🗑️</button></div>`).join('')}`}
const nl=p=>(p.notes||[]).map(n=>`<div class="card">${n.kind=='p'?'⚠️ ':''}${h(n.by)} · <span class="mu">${new Date(n.at).toLocaleString(L=='ar'?'ar-SA':'en-GB')}</span><br>${h(n.text)}${n.audio?`<br><audio controls src="${n.audio}"></audio>`:''}<div class="row np"><button onclick="editN('${p.id}','${n.at}')">✏️</button><button class="w" onclick="delN('${p.id}','${n.at}')">🗑️</button></div></div>`).join('');
const nf=p=>`<div class="card np">${p?'':`<label>${t('المريض','Patient')}<select id="np"><option value="">—</option>${D.p.map(x=>`<option value="${x.id}">${h(x.name)}</option>`).join('')}</select></label>`}<label>${t('النوع','Type')}<select id="nk"><option value="n">${t('ملاحظة','Note')}</option><option value="p">${t('مشكلة / شكوى','Problem / complaint')}</option></select></label><textarea id="nt" placeholder="${t('اكتب هنا','Write here')}"></textarea><div class="row"><button onclick="rec(this)">🎙️ ${t('تسجيل صوتي','Record')}</button><span id="au"></span><button class="p" onclick="addN(${p?"'"+p.id+"'":"g('np')"})">➕ ${t('إضافة','Add')}</button></div></div>`;
const al=p=>(p.files||[]).map((f,i)=>`<div class="card row"><div class="grow">${h(f.name)} · ${f.at.slice(0,10)}</div><button onclick="dlF('${p.id}',${i})">⬇️</button><button onclick="renF('${p.id}',${i})">✏️</button><button class="w" onclick="delF('${p.id}',${i})">🗑️</button></div>`).join('');
function saveP(){const o={mrn:g('a1'),cid:g('a2'),name:g('a3').trim(),age:g('a4'),phone:g('a5'),reason:g('a6'),day:+g('a7'),complaints:g('a8'),extra:g('a9')};
if(!o.name||!(o.day>=1&&o.day<=31)){alert(t('أدخل الاسم ويوم زيارة صحيح','Enter name and a valid visit day'));return}
let p=D.p.find(x=>x.id==PID);if(p){const old=p.day;Object.assign(p,o);if(old!=o.day)D.v.filter(v=>v.pid==p.id&&v.status=='s').forEach(v=>v.date=first(o.day))}
else{p={id:uid(),notes:[],files:[],...o};D.p.push(p);D.v.push({id:uid(),pid:p.id,date:first(o.day),time:'',status:'s'})}
save();go('pf',p.id)}
function saveV(done){const v=D.v.find(x=>x.id==VID),was=v.status=='d';
Object.assign(v,{date:g('b1'),time:g('b2'),doc:g('b3'),nur:g('b4'),sugar:g('b5'),bp:g('b6'),status:g('b7'),cond:g('b8'),newp:g('c3'),act:g('c4'),rec:g('c5')});
if(!$('c1').disabled)v.dn=g('c1');if(!$('c2').disabled)v.nn=g('c2');
if(done)v.status='d';
if(v.status=='d'&&!was&&!v.next){const p=D.p.find(x=>x.id==v.pid),[y,m]=v.date.split('-').map(Number);const nx={id:uid(),pid:v.pid,date:mk(y,m,+p.day),time:v.time,status:'s'};D.v.push(nx);v.next=nx.id}
save();go('visits')}
function rec(b){if(window.mr&&mr.state=='recording'){mr.stop();return}
navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{const c=[];window.mr=new MediaRecorder(s);mr.ondataavailable=e=>c.push(e.data);mr.onstop=()=>{const r=new FileReader();r.onload=()=>{AUD=r.result;$('au').textContent='✅';b.textContent='🎙️'};r.readAsDataURL(new Blob(c));s.getTracks().forEach(x=>x.stop())};mr.start();b.textContent='⏹️'}).catch(()=>alert(t('تعذر الوصول للميكروفون','Microphone unavailable')))}
function addN(id){const x=g('nt').trim();if(!x&&!AUD)return;const p=D.p.find(q=>q.id==id);if(!p){alert(t('اختر المريض أولًا','Choose a patient first'));return}(p.notes=p.notes||[]).unshift({by:(R=='d'?D.s.doc:D.s.nur)||t(R=='d'?'الطبيب':'الممرض',R=='d'?'Doctor':'Nurse'),text:x,audio:AUD,kind:g('nk'),at:new Date().toISOString()});AUD='';save();draw()}
function upl(i){const f=i.files[0];if(!f)return;const pid=$('fp')?g('fp'):PID,p=D.p.find(q=>q.id==pid);if(!p){alert(t('اختر المريض أولًا','Choose a patient first'));i.value='';return}
const fin=(d,nm)=>{(p.files=p.files||[]).push({name:nm||f.name,data:d,at:new Date().toISOString()});save();draw()};
if(f.type.startsWith('image/')){const im=new Image();im.onload=()=>{const k=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);fin(c.toDataURL('image/jpeg',.7),f.name.replace(/\.[^.]+$/,'')+'.jpg')};im.src=URL.createObjectURL(f)}
else{if(f.size>1500000){alert(t('الملف كبير (الحد 1.5 ميغابايت)','File too large (max 1.5 MB)'));return}const r=new FileReader();r.onload=()=>fin(r.result);r.readAsDataURL(f)}}
async function delF(id,i){if(await cf()){D.p.find(q=>q.id==id).files.splice(i,1);save();draw()}}
function rep(){const p=D.p.find(x=>x.id==g('r1'));if(!p)return;const a=g('r2')||'0000',b=g('r3')||'9999';const vs=D.v.filter(v=>v.pid==p.id&&v.date>=a&&v.date<=b).sort((x,y)=>x.date.localeCompare(y.date));
$('rp').innerHTML=`<h2>${h(p.name)} — ${h(p.mrn)}</h2><div class="card">${t('الهوية','ID')}: ${h(p.cid)} · ${t('العمر','Age')}: ${h(p.age)} · ${h(p.phone)}<br>${t('سبب المرض','Reason')}: ${h(p.reason)}<br>${t('المشاكل','Problems')}: ${h(p.complaints)}</div><div class="wrap"><table><tr><th>${t('التاريخ','Date')}</th><th>${t('الحالة','Status')}</th><th>${t('السكر','Sugar')}</th><th>${t('الضغط','BP')}</th><th>${t('الطبيب','Doctor')}</th><th>${t('الممرض','Nurse')}</th><th>${t('المشاكل والإجراءات والتوصيات','Problems, actions, recs')}</th></tr>${vs.map(v=>`<tr><td>${v.date}</td><td>${st(v.status)}</td><td>${h(v.sugar)}</td><td>${h(v.bp)}</td><td>${h(v.dn)}</td><td>${h(v.nn)}</td><td>${h([v.newp,v.act,v.rec].filter(Boolean).join(' | '))}</td></tr>`).join('')}</table></div><h2>${t('الملاحظات','Notes')}</h2>${(p.notes||[]).filter(n=>n.at.slice(0,10)>=a&&n.at.slice(0,10)<=b).map(n=>`<p>${h(n.by)} (${n.at.slice(0,10)}): ${h(n.text)||'🎙️'}</p>`).join('')}`}
function ask(msg,def){return new Promise(r=>{const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#000a;z-index:99;display:flex;align-items:center;justify-content:center;padding:20px';const inp=def!==undefined;o.innerHTML='<div class="card" style="max-width:520px;width:100%"><p>'+h(msg)+'</p>'+(inp?'<input id="dq" value="'+h(def)+'">':'')+'<div class="row"><button class="p" id="dy">'+t('موافق','OK')+'</button><button id="dn">'+t('إلغاء','Cancel')+'</button></div></div>';document.body.appendChild(o);const f=v=>{o.remove();r(v)};$('dy').onclick=()=>f(inp?g('dq'):true);$('dn').onclick=()=>f(inp?null:false)})}
window.alert=m=>{ask(String(m))};window.onerror=m=>{ask('Error: '+m)};
const cf=()=>ask(t('هل أنت متأكد من الحذف؟','Are you sure you want to delete?'));
function dlR(){if(!$('rp').innerHTML)rep();const html='<!DOCTYPE html><html dir="'+(L=='ar'?'rtl':'ltr')+'"><meta charset="utf-8"><title>report</title><style>body{font:18px system-ui;padding:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #444;padding:6px}.card{border:1px solid #444;padding:10px;margin:8px 0}</style><body>'+$('rp').innerHTML+'<script>setTimeout(()=>print(),400)<\/script></body></html>';sv('report-'+today()+'.html',html)}
async function delP(id){if(!await cf())return;D.p=D.p.filter(p=>p.id!=id);D.v=D.v.filter(v=>v.pid!=id);save();go('patients')}
async function delV(id,b){if(!await cf())return;D.v=D.v.filter(v=>v.id!=id);save();b?go('visits'):draw()}
async function editN(pid,at){const n=D.p.find(p=>p.id==pid).notes.find(x=>x.at==at);const x=await ask(t('تعديل الملاحظة','Edit note'),n.text);if(x===null)return;n.text=x;save();draw()}
async function delN(pid,at){if(!await cf())return;const p=D.p.find(q=>q.id==pid);p.notes=p.notes.filter(x=>x.at!=at);save();draw()}
async function renF(pid,i){const f=D.p.find(p=>p.id==pid).files[i];const x=await ask(t('اسم المرفق','Attachment name'),f.name);if(x){f.name=x;save();draw()}}
async function clrR(id){if(!await cf())return;const v=D.v.find(x=>x.id==id);v.sugar='';v.bp='';save();draw()}
function cpM(id){const v=D.v.find(x=>x.id==id),m=D.s.tpl.replace('{date}',v.date).replace('{time}',v.time||'').replace('{name}',pn(v.pid));navigator.clipboard.writeText(m).then(()=>alert(t('تم نسخ الرسالة','Message copied')),()=>ask(m,m))}
async function rp2(){const x=g('pb').trim();if(!x)return;if(!await ask(t('سيتم استبدال البيانات الحالية. متابعة؟','Current data will be replaced. Continue?')))return;try{D=JSON.parse(x);L=D.s.lang||'ar';save();go('home')}catch(e){alert(t('النص غير صالح','Invalid text'))}}
function cpB(){navigator.clipboard.writeText(JSON.stringify(D)).then(()=>alert(t('تم نسخ النسخة الاحتياطية','Backup copied')),()=>alert(t('تعذر النسخ','Copy failed')))}
async function sv(name,data){try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename:name,data});return}}catch(e){if(e&&e.code=='declined')return;alert(t('تعذر الحفظ: ','Save failed: ')+(e&&e.message||e));return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=name;a.click()}
function bk(){sv('homecare-backup-'+today()+'.json',JSON.stringify(D))}
function dlF(pid,i){const f=D.p.find(p=>p.id==pid).files[i];fetch(f.data).then(r=>r.blob()).then(b=>sv(f.name,b))}
async function rs(i){const f=i.files[0];if(!f||!await ask(t('سيتم استبدال البيانات الحالية. متابعة؟','Current data will be replaced. Continue?')))return;f.text().then(x=>{try{D=JSON.parse(x);L=D.s.lang||'ar';save();go('home')}catch(e){alert(t('ملف غير صالح','Invalid file'))}})}
draw();
</script></body></html>
